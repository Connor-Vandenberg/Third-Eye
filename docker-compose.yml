# =============================================================================
# THIRD-EYE FRONTEND - DOCKER COMPOSE (GZM INTEGRATED)
# =============================================================================
# Runs Third-Eye connected to the full GZM backend infrastructure.
#
# Standalone:
#   docker compose up -d
#
# With GZM backend (from Gray-Zone-Monitor repo):
#   cd ../Gray-Zone-Monitor && docker compose up -d
#   cd ../Third-Eye && docker compose up -d
#
# The frontend joins gzm-network to communicate with all backend services.
# =============================================================================

services:
  third-eye:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/connor-vandenberg/gzm-third-eye:latest
    container_name: gzm-third-eye
    restart: unless-stopped
    ports:
      - "${THIRDEYE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # GZM Backend wiring (internal Docker network)
      - NEXT_PUBLIC_GZM_API_URL=http://gzm-api:8080
      - NEXT_PUBLIC_GZM_MCP_URL=http://gzm-mcp:8090
      - NEXT_PUBLIC_GZM_GEOINT_URL=http://gzm-geoint:8080
      - NEXT_PUBLIC_GZM_ISR_URL=http://gzm-isr:8087
      - NEXT_PUBLIC_GZM_REPORTING_URL=http://gzm-reporting:8086
      - NEXT_PUBLIC_GZM_WS_URL=ws://gzm-gods-eye:9090/ws
      - NEXT_PUBLIC_MAP_URL=https://map.grayzonemonitor.com
      - NEXT_PUBLIC_APP_URL=https://grayzonemonitor.com
    env_file:
      - path: .env
        required: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    networks:
      - gzm-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  gzm-network:
    external: true
    name: gzm-network
