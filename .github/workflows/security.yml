name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    name: npm Security Audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high

      - name: Check for known vulnerable packages
        run: |
          echo "Checking lockfile integrity..."
          npm ci --ignore-scripts
          echo "Lockfile OK"

  dependency-review:
    runs-on: ubuntu-latest
    name: Dependency Review
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  lighthouse:
    runs-on: ubuntu-latest
    name: Security Headers Check
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_GZM_API_URL: http://localhost:8000
      - name: Verify security headers in build output
        run: |
          echo "Checking next.config.ts for security headers..."
          grep -q 'X-Frame-Options' next.config.ts && echo '\u2705 X-Frame-Options present'
          grep -q 'Content-Security-Policy' next.config.ts && echo '\u2705 CSP present'
          grep -q 'Strict-Transport-Security' next.config.ts && echo '\u2705 HSTS present'
          grep -q 'poweredByHeader: false' next.config.ts && echo '\u2705 X-Powered-By disabled'
          echo "All security headers verified."
